<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Crepe & Waffle Café account for exclusive rewards, order tracking, and tasting reservations.">
    <title>Sign Up — Crepe & Waffle Café</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="components.js" defer></script>
</head>
<body class="auth-page">
    <!-- Top Bar with Theme & Direction Controls -->
    <div class="auth-topbar">
        <div style="display:flex;gap:0.5rem;">
            <button onclick="toggleDir(event)" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle direction">
                <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
            </button>
            <button onclick="toggleTheme(event)" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
                <span class="theme-icon-wrap"><i class="fa-solid fa-moon"></i></span>
            </button>
        </div>
    </div>

    <!-- Main Auth Card -->
    <main class="auth-main">
        <div class="auth-card auth-card--wide">
            <!-- Decorative ambient orb -->
            <div class="auth-card-orb"></div>

            <!-- Logo (Clickable to Home) -->
            <a href="index.html" class="auth-logo" aria-label="Crepe & Waffle Café Home">
                <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="signupLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#E11D48"/>
                            <stop offset="50%" stop-color="#BE123C"/>
                            <stop offset="100%" stop-color="#881337"/>
                        </linearGradient>
                        <linearGradient id="signupWaffle" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FCD34D"/>
                            <stop offset="50%" stop-color="#F59E0B"/>
                            <stop offset="100%" stop-color="#D97706"/>
                        </linearGradient>
                        <linearGradient id="signupCrepe" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFF5F5"/>
                            <stop offset="45%" stop-color="#FFE4E6"/>
                            <stop offset="100%" stop-color="#FECDD3"/>
                        </linearGradient>
                    </defs>
                    <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#signupLogoBg)"/>
                    <rect x="9.5" y="9.5" width="81" height="81" rx="22.5" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
                    <g transform="translate(20, 36)">
                        <rect x="0" y="0" width="38" height="38" rx="9" fill="url(#signupWaffle)"/>
                        <rect x="4" y="4" width="13" height="13" rx="3.5" fill="#78350F" opacity="0.45"/>
                        <rect x="21" y="4" width="13" height="13" rx="3.5" fill="#78350F" opacity="0.45"/>
                        <rect x="4" y="21" width="13" height="13" rx="3.5" fill="#78350F" opacity="0.45"/>
                        <rect x="21" y="21" width="13" height="13" rx="3.5" fill="#78350F" opacity="0.45"/>
                        <circle cx="10.5" cy="10.5" r="1.5" fill="#FFFFFF" opacity="0.85"/>
                        <circle cx="27.5" cy="27.5" r="1.5" fill="#FFFFFF" opacity="0.85"/>
                    </g>
                    <path d="M40 22 C56 16, 78 22, 82 38 C86 54, 72 74, 52 78 C40 68, 42 48, 54 38 C62 30, 50 24, 40 22 Z" fill="url(#signupCrepe)"/>
                    <path d="M46 25 C58 20, 75 26, 78 38 C81 50, 70 66, 56 73" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2.5 3.5" opacity="0.75"/>
                    <circle cx="48" cy="22" r="5" fill="#BE123C"/>
                    <circle cx="46.5" cy="20.5" r="1.5" fill="#FDA4AF"/>
                    <circle cx="56" cy="19" r="4" fill="#9F1239"/>
                    <path d="M51 15 C54 10, 59 11, 59 14 C59 17, 54 18, 51 15 Z" fill="#34D399"/>
                </svg>
                <div class="auth-logo-text">
                    <span class="brand-top">CREPE</span>
                    <span class="brand-bottom">& Waffle</span>
                </div>
            </a>

            <!-- Header -->
            <div class="auth-header">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join our community and unlock exclusive rewards</p>
            </div>

            <!-- Social Signup 3-Column Grid -->
            <div class="social-login-grid">
                <button type="button" class="social-btn" title="Sign up with Google" onclick="alert('Google sign-up coming soon!')">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                </button>
                <button type="button" class="social-btn" title="Sign up with Apple" onclick="alert('Apple sign-up coming soon!')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                </button>
                <button type="button" class="social-btn" title="Sign up with Facebook" onclick="alert('Facebook sign-up coming soon!')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                </button>
            </div>

            <!-- Divider -->
            <div class="divider">or sign up with email</div>

            <!-- Form -->
            <form class="auth-form" onsubmit="event.preventDefault(); alert('Account created successfully!'); window.location.href='login.html';" id="signup-form">
                <div class="form-group">
                    <label class="form-label" for="signup-fname">First Name</label>
                    <input type="text" id="signup-fname" class="form-input" placeholder="First name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-lname">Last Name</label>
                    <input type="text" id="signup-lname" class="form-input" placeholder="Last name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" class="form-input" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-phone">Phone Number</label>
                    <input type="tel" id="signup-phone" class="form-input" placeholder="+1 (555) 000-0000" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signup-password" class="form-input" placeholder="Create a password" required minlength="8">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-password', this)" aria-label="Toggle password visibility">
                            <span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-confirm">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signup-confirm" class="form-input" placeholder="Confirm your password" required minlength="8">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-confirm', this)" aria-label="Toggle password visibility">
                            <span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                        </button>
                    </div>
                </div>
                <div class="checkbox-wrapper" style="margin-bottom:1.5rem;">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="coming-soon.html" class="link-primary">Terms of Service</a> and <a href="coming-soon.html" class="link-primary">Privacy Policy</a></label>
                </div>
                <button type="submit" class="btn btn-primary w-full btn-lg">Create Account</button>
            </form>

            <!-- Footer link -->
            <p class="auth-footer-text">
                Already have an account? <a href="login.html" class="link-primary">Sign In</a>
            </p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuthPage();
        });
    </script>
</body>
</html>
