<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something exciting is coming soon to Crepe & Waffle Café. Stay tuned for handcrafted crepes, artisan waffles, and sweet surprises!">
    <title>Coming Soon — Crepe & Waffle Café</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
        <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
    <script src="components.js" defer></script>
</head>
<body class="fullscreen-page">

    <!-- Top Bar in Flow -->
    <header class="fullscreen-topbar">
        <a href="index.html" class="nav-logo" aria-label="Crepe & Waffle Café Home">
            <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:38px;height:38px;object-fit:contain;display:block;">
                <rect x="15" y="35" width="70" height="55" rx="10" fill="var(--primary)"/>
                <line x1="35" y1="35" x2="35" y2="90" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <line x1="50" y1="35" x2="50" y2="90" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <line x1="65" y1="35" x2="65" y2="90" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <line x1="15" y1="52" x2="85" y2="52" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <line x1="15" y1="70" x2="85" y2="70" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <ellipse cx="50" cy="30" rx="28" ry="12" fill="var(--primary-light)"/>
                <ellipse cx="50" cy="30" rx="20" ry="8" fill="var(--primary-dark)" opacity="0.4"/>
                <circle cx="40" cy="22" r="5" fill="var(--secondary)"/>
                <circle cx="55" cy="20" r="4" fill="var(--secondary)" opacity="0.8"/>
                <circle cx="50" cy="15" r="3" fill="var(--secondary)" opacity="0.6"/>
            </svg>
            <div class="nav-logo-text">
                <span class="brand-top">CREPE</span>
                <span class="brand-bottom">& Waffle</span>
            </div>
        </a>

        <div style="display:flex;gap:0.5rem;align-items:center;">
            <button onclick="toggleDir(event)" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle direction">
                <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
            </button>
            <button onclick="toggleTheme(event)" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
                <span class="theme-icon-wrap"></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="fullscreen-content">
        <div class="fullscreen-box">
            <!-- Decorative Ambient Glow -->
            <div class="fullscreen-glow"></div>

            <div style="position:relative;z-index:2;">
                <!-- Status Badge -->
                <div class="section-label" style="justify-content:center;margin-bottom:1.25rem;">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Under Construction
                </div>

                <h1 class="coming-title">Coming Soon</h1>
                <p class="coming-desc">
                    We're handcrafting something delicious for you. This sweet new experience will be available shortly. Subscribe below to receive VIP opening invitations!
                </p>

                <!-- 4-Column Live Countdown Timer -->
                <div class="countdown-grid" id="countdown">
                    <div class="countdown-item">
                        <div class="countdown-value" id="cd-days">30</div>
                        <div class="countdown-label">Days</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-value" id="cd-hours">00</div>
                        <div class="countdown-label">Hours</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-value" id="cd-mins">00</div>
                        <div class="countdown-label">Minutes</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-value" id="cd-secs">00</div>
                        <div class="countdown-label">Seconds</div>
                    </div>
                </div>

                <!-- Email Subscription Form -->
                <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Thank you! We will notify you the moment this page launches.'); this.reset();">
                    <input type="email" placeholder="Enter your email address" required aria-label="Email address">
                    <button type="submit" class="btn btn-primary">Notify Me</button>
                </form>

                <!-- Social Links -->
                <div class="coming-socials">
                    <a href="#" class="coming-social-link" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="coming-social-link" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="coming-social-link" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                </div>

                <div style="margin-top:2.25rem;">
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fa-solid fa-house"></i>
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initAuthPage === 'function') initAuthPage();

            // Live Countdown Timer (Target: 30 days from now)
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 30);

            function updateCountdown() {
                const now = new Date();
                const diff = targetDate - now;
                if (diff <= 0) return;

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                const d = document.getElementById('cd-days');
                const h = document.getElementById('cd-hours');
                const m = document.getElementById('cd-mins');
                const s = document.getElementById('cd-secs');

                if (d) d.textContent = String(days).padStart(2, '0');
                if (h) h.textContent = String(hours).padStart(2, '0');
                if (m) m.textContent = String(mins).padStart(2, '0');
                if (s) s.textContent = String(secs).padStart(2, '0');
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
