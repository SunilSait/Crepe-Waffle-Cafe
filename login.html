<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Crêpe & Waffle Café account for exclusive offers and order tracking.">
    <title>Sign In — Crêpe & Waffle Café</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="components.js" defer></script>
</head>
<body class="auth-page">
    <!-- Top Actions (no navbar/footer) -->
    <div class="auth-top-actions">
        <button onclick="toggleDir(event)" class="nav-icon-btn" title="Toggle Direction" aria-label="Toggle direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">RTL</span>
        </button>
        <button onclick="toggleTheme(event)" class="nav-icon-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"></span>
        </button>
    </div>

    <div class="auth-card">
        <!-- Logo inside card — clickable to home -->
        <a href="index.html" class="auth-logo" aria-label="Home">
            <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="15" y="35" width="70" height="55" rx="10" fill="var(--primary)"/>
                <line x1="35" y1="35" x2="35" y2="90" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <line x1="50" y1="35" x2="50" y2="90" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <line x1="65" y1="35" x2="65" y2="90" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <line x1="15" y1="52" x2="85" y2="52" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <line x1="15" y1="70" x2="85" y2="70" stroke="var(--secondary)" stroke-width="2" opacity="0.3"/>
                <ellipse cx="50" cy="30" rx="28" ry="12" fill="var(--primary-light)"/>
                <ellipse cx="50" cy="30" rx="20" ry="8" fill="var(--primary-dark)" opacity="0.4"/>
                <circle cx="40" cy="22" r="5" fill="var(--secondary)"/>
                <circle cx="55" cy="20" r="4" fill="var(--secondary)" opacity="0.8"/>
                <circle cx="50" cy="15" r="3" fill="var(--secondary)" opacity="0.6"/>
            </svg>
            <div class="nav-logo-text">
                <span class="brand-top">CRÊPE</span>
                <span class="brand-bottom">& Waffle</span>
            </div>
        </a>

        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your account to continue</p>

        <form class="auth-form" onsubmit="event.preventDefault(); alert('Sign in successful!'); window.location.href='index.html';">
            <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-input" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', this)" aria-label="Toggle password visibility">
                        <span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                    </button>
                </div>
            </div>
            <div class="auth-extras">
                <label class="remember-wrap">
                    <input type="checkbox" id="remember-me">
                    <span>Remember Me</span>
                </label>
                <a href="coming-soon.html" class="forgot-link">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-full">Sign In</button>
        </form>

        <div class="auth-divider">or continue with</div>

        <div class="social-logins">
            <button type="button" class="social-btn" onclick="alert('Google sign-in coming soon!')">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Continue with Google
            </button>
            <button type="button" class="social-btn" onclick="alert('Apple sign-in coming soon!')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                Continue with Apple
            </button>
            <button type="button" class="social-btn" onclick="alert('Facebook sign-in coming soon!')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                Continue with Facebook
            </button>
        </div>

        <p class="auth-footer-text">Don't have an account? <a href="signup.html">Create Account</a></p>
    </div>

    <script>initAuthPage();</script>
</body>
</html>
